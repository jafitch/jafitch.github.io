<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./scripts/site.js" defer></script>
    <script src="./scripts/recipes.js" defer></script>
</head>

<body>
    <header>
        <h1>Jeff Fitch</h1>
    </header>

    <nav>
        <a href="./index.htm" id="home">Home</a>
        <a href="./order.htm" id="order">Order</a>
        <a href="./recipes.htm" id="recipes" class="active">Recipes</a>
    </nav>

    <section>

        <section>
            <h1>Recipes</h1>
            <div class="page-actions">
                <a href="./create-recipe.htm" class="primary-button">Add a Recipe</a>
            </div>
        </section>
        <div class="recipes">

        </div>
    </section>
    <div class="modal" id="recipesModal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div class="modal-header">
                <h2 id="recipesmodalName" class="modal-title"></h2>
            </div>
            <div class="modal-body">
                <div class="modal-hero">
                    <img id="recipesmodalImage" src="" alt="recipe image">
                    <button id="deleteRecipeButton" class="delete-button" type="button">Delete Recipe</button>
                </div>
                <div class="modal-details">
                    <div class="recipe-columns">
                        <div class="recipe-detail-group">
                            <p><strong>Ingredients:</strong></p>
                            <ul id="recipesmodalIngredients" class="recipe-list"></ul>
                        </div>
                        <div class="recipe-detail-group">
                            <p><strong>Instructions:</strong></p>
                            <ol id="recipesmodalInstructions" class="recipe-instructions"></ol>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <p><span>&copy;</span> 2026 Jeff's webpage. All rights reserved.</p>
    </footer>
</body>

</html>
