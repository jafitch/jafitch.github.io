<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Jeff's Admin Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <script src="scripts/site.js" defer></script>
</head>

<body>

    <header class="header">

        <nav>
            <a href="/index.htm" id="home" class="active">Home</a>
            <a href="/order.htm" id="order">Order</a>
            <a href="/recipes.htm" id="recipes">Recipes</a>
        </nav>
    </header>
    <h1>Admin Dashboard</h1>

    <hr>

    <h2>Add Menu Item</h2>
    <form id="menuForm">
        <select name="category" placeholder="Category" required><br>
            <option value="" disabled selected hidden>Choose an option...</option>
            <option value="Entree">Entree</option>
            <option value="Side">Side</option>
            <option value="Drink">Drink</option>
        </select><br>
        <input type="text" name="name" placeholder="Item Name" required><br>
        <textarea name="description" placeholder="Description"></textarea><br>
        <input type="number" step="0.01" name="price" placeholder="Price"><br>
        <input type="text" name="image" placeholder="Image URL"><br>
        <button type="submit">Add Menu Item</button>
    </form>

    <hr>

    <h2>Add Event</h2>
    <form id="eventForm">
        <input type="text" name="name" placeholder="Event Name" required><br>
        <input type="date" name="date" required><br>
        <input type="text" name="location" placeholder="Location"><br>
        <button type="submit" id="eventAdd">Add Event</button>
    </form>

    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; Happy Taco</p>

            <nav class="footer-links">
                <a href="/menu.html">Menu</a>
                <a href="/locations.html">Events</a>
                <a href="/admin.html">Admin</a>
            </nav>
        </div>
    </footer>

</body>

</html>
